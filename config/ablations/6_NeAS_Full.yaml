exp:
  datadir: ./data/foot_50.pickle
  expdir: ./checkpoints/
  expname: 6_NeAS_Full
log:
  i_eval: 50
  i_save: 50
  use_wandb: false
network:
  encoding_type: hash
  feature_dim: 8
  materials:
  - {alpha: 0.0685, beta: 0.0}
  - {alpha: 0.1819, beta: 0.0685}
  num_materials: 2
  s_param: 20.0
  shared_latent: true
  soft_selector: true
train:
  epoch: 1000
  floater_reg: true
  lambda_mask: 0.1
  lambda_reg: 0.01
  lrate: 0.001
  lrate_gamma: 0.1
  lrate_step: 500
  n_batch: 1
  n_mask_rays: 128
  n_rays: 512
  n_samples: 320
  num_views: 50
  val_chunk_size: 1024
  val_n_samples: 128
